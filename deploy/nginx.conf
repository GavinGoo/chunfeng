# 春风 · nginx 站点配置（13 §5.4），Docker 与 Node 两种部署方式通用，默认 HTTPS（D46）
# 用法：
#   1. 把文件里的 <DOMAIN> 换成实际域名，<nginx_conf> 换成 nginx 的配置目录（apt 安装为 /etc/nginx，源码 / LNMP 为 /usr/local/nginx/conf）；
#      证书（fullchain + 私钥）事先放到下面 ssl_certificate / ssl_certificate_key 指向的路径
#   2. 复制为单独的站点文件：sudo cp deploy/nginx.conf <nginx_conf>/vhost/<DOMAIN>.conf
#      主配置 <nginx_conf>/nginx.conf 的 http { } 里要有 include vhost/*.conf;（没有就加一行）
#   3. sudo nginx -t && sudo systemctl reload nginx（或 nginx -s reload）
# 多个域名反代到同一后端：两处 server_name 都写上全部域名（空格隔开，应用里不需要任何配置，D45），证书须覆盖全部域名，
# 并把跳转里的 $server_name 改为 $host（$server_name 只取第一个域名）。不要为第二个域名再复制一份本文件：limit_req_zone 会重名。

limit_req_zone $binary_remote_addr zone=chunfeng_api:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=chunfeng_upload:10m rate=10r/m;   # R15

# http 自动跳转 https。只跳转、不转发给应用
server
    {
        listen 80;
        server_name <DOMAIN>;
        return 301 https://$server_name$request_uri;
    }

server
    {
        listen 443 ssl;
        server_name <DOMAIN>;

        ssl_certificate <nginx_conf>/ssl/<DOMAIN>/fullchain.pem;
        ssl_certificate_key <nginx_conf>/ssl/<DOMAIN>/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 8k;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        # 每个 location 都写全转发头：X-Real-IP 是应用识别客户端 IP 的依据（04 §6）
        location = /api/readings
            {
                limit_req zone=chunfeng_api burst=10 nodelay;
                proxy_read_timeout 75s;              # 大于服务端总预算 50 s
                proxy_pass http://127.0.0.1:3000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
            }

        # R15：上传单独放宽请求体大小并单独限速（应用内限 8 MiB，15 §5.2）
        location = /api/uploads
            {
                client_max_body_size 9m;
                limit_req zone=chunfeng_upload burst=5 nodelay;
                proxy_read_timeout 30s;
                proxy_pass http://127.0.0.1:3000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
            }

        location /
            {
                proxy_pass http://127.0.0.1:3000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
            }
    }
